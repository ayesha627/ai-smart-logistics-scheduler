{% extends 'base.html' %}

{% block header_title %}Delete Van{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 border-danger border-opacity-50">
            <h4 class="mb-4 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Deletion</h4>
            
            <p class="fs-5">Are you sure you want to delete the van <strong>{{ object.vehicle_number }}</strong>?</p>
            <p class="text-muted mb-4">This action cannot be undone.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'van_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
